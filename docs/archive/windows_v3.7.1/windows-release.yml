name: Windows installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/windows/**'
      - 'agent/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/windows-smoke.py'
      - '.github/workflows/windows-release.yml'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e . pyinstaller pywebview pystray pillow
      - run: python -m unittest discover -s tests -p test_windows.py -v
      - run: python -m unittest discover -s tests -p test_desktop_startup.py -v
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: python scripts/windows-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 1top-windows-x64
          path: |
            release/**/*.exe
            build/windows/smoke-report.json
            build/windows/cold-start*.json
            build/windows/existing-collector.json
            build/windows/empty-first-launch.json
            build/windows/diagnostics/**
          if-no-files-found: error
