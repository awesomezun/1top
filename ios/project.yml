# Native iPhone app for 1top. Generate the Xcode project with `xcodegen generate` in this folder.
name: OneTop
options:
  bundleIdPrefix: si.onetop
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 2DY8KQ6H5F
    MARKETING_VERSION: "4.4.0"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  OneTop:
    type: application
    platform: iOS
    sources:
      - path: OneTop
    settings:
      base:
        # Development builds stay beside the store app (si.onetop.mobile) until release.
        PRODUCT_BUNDLE_IDENTIFIER: si.onetop.mobile.dev
        PRODUCT_NAME: 1top
        PRODUCT_MODULE_NAME: OneTop
        INFOPLIST_KEY_CFBundleDisplayName: 1top
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  # Device QA: drives the app on a real iPhone. Controls go only to the session named by QA_SESSION.
  OneTopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OneTopUITests
    dependencies:
      - target: OneTop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: si.onetop.mobile.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OneTop
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  # Logic tests: photo preparation, message ordering and merging, drafts during back-to-back sends.
  OneTopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OneTopTests
    dependencies:
      - target: OneTop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: si.onetop.mobile.dev.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/1top.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)1top"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  OneTop:
    build:
      targets:
        OneTop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OneTopTests
        - OneTopUITests
