name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  agent:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -q
      - run: xcrun swiftc desktop/DashboardModel.swift tests/desktop/ModelChecks.swift -o /tmp/onetop-model-checks && /tmp/onetop-model-checks
      - run: xcrun swiftc desktop/QuickText.swift tests/desktop/QuickTextChecks.swift -o /tmp/onetop-text-checks && /tmp/onetop-text-checks
      # The menu bar's cluster reads the dashboard cluster's numbers from the same demo state.
      - run: node tests/cluster-fixture.mjs /tmp/onetop-cluster && xcrun swiftc desktop/DashboardModel.swift desktop/ClusterModel.swift tests/desktop/ClusterChecks.swift -o /tmp/onetop-cluster-checks && /tmp/onetop-cluster-checks /tmp/onetop-cluster
      # The menu bar and the iPhone keep one copy of the customizing layout model, read like the web's from the same stored cases.
      - run: xcrun swiftc desktop/LayoutModel.swift tests/desktop/LayoutChecks.swift -o /tmp/onetop-layout-checks && /tmp/onetop-layout-checks tests/fixtures/layout_v1.json
      - run: xcrun swiftc -framework AppKit -framework SwiftUI -framework WebKit desktop/*.swift -o /tmp/onetop-desktop-check
      # The menu bar's customizing, drawn offscreen with the cluster fixture's demo state: seeded layouts stay inside the panel and its housing, and the edit mode works and keeps each change.
      - run: xcrun swiftc -framework AppKit -framework SwiftUI -framework WebKit $(ls desktop/*.swift | grep -v OneTop.swift) tests/desktop/CustomizeChecks.swift -o /tmp/onetop-customize-checks && /tmp/onetop-customize-checks /tmp/onetop-cluster/state-1h.json
  desktop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/preview-desktop.mjs && node tests/weekly.mjs && node tests/layout.mjs && node tests/maps.mjs && node tests/session-groups.mjs && node tests/dashboard-gauges.mjs && node tests/ranges.mjs && node tests/speed.mjs && node tests/history.mjs && node tests/conversation.mjs && node tests/demo-usage.mjs && node tests/i18n-collector.mjs && node tests/quick-view.mjs && node tests/cluster.mjs && node tests/check-zh.mjs && node tests/check-zh.mjs --lang en
