name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  agent:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -q
      - run: xcrun swiftc desktop/DashboardModel.swift tests/desktop/ModelChecks.swift -o /tmp/onetop-model-checks && /tmp/onetop-model-checks
      - run: xcrun swiftc -framework AppKit -framework SwiftUI -framework WebKit desktop/*.swift -o /tmp/onetop-desktop-check
  cloud-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/weekly.mjs && node tests/maps.mjs && node tests/relay-settings.mjs && node tests/session-groups.mjs && node tests/dashboard-gauges.mjs && node tests/ranges.mjs && node tests/cockpit.mjs
      - run: npm ci --legacy-peer-deps && npm test && npm run check
        working-directory: cloud
      - run: npm ci && npm run build
        working-directory: site

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run check && npm run lint && node --experimental-strip-types --test test/metrics.test.mjs test/fleet.test.mjs
        working-directory: mobile
