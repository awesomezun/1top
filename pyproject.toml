[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "onetop-agent"
version = "3.1.0"
description = "Your AI agents, across apps and computers."
requires-python = ">=3.11"
dependencies = ["psutil>=7,<8", "websocket-client>=1.8,<2", "certifi>=2025.1"]
license = "MIT"
[project.scripts]
1top = "onetop.cli:main"
[tool.setuptools]
package-dir = {"" = "agent"}
[tool.setuptools.package-data]
onetop = ["dist/*", "dist/fonts/ibm-plex/v1.0.0/*"]
